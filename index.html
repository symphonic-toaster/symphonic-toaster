<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>symphonic-toaster</title>
<meta name="robots" content="noindex">
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; padding: 4rem 1.25rem;
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #1f1f1f; background: #fafafa;
  }
  @media (prefers-color-scheme: dark) { body { color: #e6e6e6; background: #141414; } }
  main { max-width: 36rem; margin: 0 auto; }
  h1 { font-size: 1.5rem; font-weight: 600; margin: 0 0 1rem; }
  p { margin: 0 0 1rem; }
  code { font: 0.95em/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
         padding: 0.1em 0.35em; border-radius: 4px; background: rgba(127,127,127,0.15); }
  pre { padding: 0.75rem 1rem; border-radius: 6px; background: rgba(127,127,127,0.15); overflow-x: auto; }
  pre code { padding: 0; background: none; }
  a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>symphonic-toaster</h1>
  <p>An automated client that retrieves publicly available web pages. Its requests identify themselves with this <code>User-Agent</code>:</p>
  <pre><code>symphonic-toaster/&lt;version&gt; (+https://symphonic-toaster.github.io/symphonic-toaster)</code></pre>
  <p>To reach the operator, <a href="https://github.com/symphonic-toaster/symphonic-toaster/issues/new">open an issue</a>.</p>
</main>
